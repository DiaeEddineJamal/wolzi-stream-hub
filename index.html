    <!-- Canonical URL -->
    <link rel="canonical" href="https://wolziflix.com/" />
    
    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WolziFlix",
      "alternateName": "WolziFlix Streaming Platform",
      "url": "https://wolziflix.com",
      "logo": "https://wolziflix.com/website-logo.png",
      "description": "WolziFlix is a premier streaming platform and content aggregator for movies, TV shows, and anime. Discover and watch thousands of titles online.",
      "sameAs": [
        "https://github.com/DiaeEddineJamal"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "url": "https://wolziflix.com/contact"
      },
      "areaServed": "Worldwide",
      "knowsAbout": ["Streaming", "Movies", "TV Shows", "Anime", "Entertainment"],
      "foundingDate": "2024"
    }
    </script>
    
    <!-- WebSite Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WolziFlix",
      "alternateName": "WolziFlix Streaming",
      "url": "https://wolziflix.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://wolziflix.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "WolziFlix",
        "logo": {
          "@type": "ImageObject",
          "url": "https://wolziflix.com/website-logo.png"
        }
      }
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Force favicon refresh with increased version number -->
    <link rel="icon" href="/favicon.ico?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" type="image/x-icon" />
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-6329609540816457">
    <!-- AdSense script loaded dynamically in React to handle ad blockers gracefully -->
    
    <!-- Register service workers for auth management -->
    <script>
      // Register service workers
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Register auth service worker
          navigator.serviceWorker.register('/auth-service-worker.js')
            .then(registration => {
              console.log('Auth service worker registered:', registration.scope);
            })
            .catch(error => {
              console.log('Auth service worker registration failed:', error);
            });
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
</html>
