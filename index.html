<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WolziFlix - Stream Movies, TV Shows & Anime</title>
    <meta name="description" content="WolziFlix - Your premier destination for streaming movies, TV series, and anime. Enjoy a vast library of content anytime, anywhere." />
    <meta name="author" content="WolziFlix" />

    <meta property="og:title" content="WolziFlix - Stream Movies, TV Shows & Anime" />
    <meta property="og:description" content="Your premier destination for streaming movies, TV series, and anime. Enjoy a vast library of content anytime, anywhere." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/wolziflix-social-card.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@wolziflix" />
    <meta name="twitter:image" content="/wolziflix-social-card.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Force favicon refresh with increased version number -->
    <link rel="icon" href="/favicon.ico?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" type="image/x-icon" />
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-6329609540816457">
    <!-- AdSense script loaded dynamically in React to handle ad blockers gracefully -->
    
    <!-- Register service workers for auth management -->
    <script>
      // Register service workers
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Register auth service worker
          navigator.serviceWorker.register('/auth-service-worker.js')
            .then(registration => {
              console.log('Auth service worker registered:', registration.scope);
            })
            .catch(error => {
              console.log('Auth service worker registration failed:', error);
            });
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
